<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow | Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-app">

    <header>
      <h1>🌤️ WeatherNow</h1>
      <p>Check the weather anywhere</p>
    </header>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name...">
      <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <main id="weatherCard" class="weather-card hidden">

      <div class="location">
        <h2 id="city">New Delhi</h2>
        <span id="date"></span>
      </div>

      <div class="weather-main">
        <div>
          <span id="weatherIcon">☀️</span>
          <p id="condition">Clear Sky</p>
        </div>

        <div>
          <h3><span id="temperature">28</span>°C</h3>
          <p>Feels like <span id="feelsLike">29</span>°C</p>
        </div>
      </div>

      <div class="details">

        <div class="detail">
          <span>💧</span>
          <p>Humidity</p>
          <strong id="humidity">60%</strong>
        </div>

        <div class="detail">
          <span>💨</span>
          <p>Wind</p>
          <strong id="wind">10 km/h</strong>
        </div>

        <div class="detail">
          <span>🌡️</span>
          <p>Pressure</p>
          <strong id="pressure">1012 hPa</strong>
        </div>

        <div class="detail">
          <span>👁️</span>
          <p>Visibility</p>
          <strong id="visibility">10 km</strong>
        </div>

      </div>

    </main>

    <div id="welcome" class="welcome">
      <div>🌍</div>
      <h2>Search for a city</h2>
      <p>Enter any city name to see its current weather.</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
